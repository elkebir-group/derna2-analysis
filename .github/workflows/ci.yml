# What a checkout can check without the deposits.
#
# The verify targets are deliberately absent. Each one checks a built figure or table against
# a digest in pins/, and every one of them needs a deposit — 1.4 GiB for E1, 2.1 for E2, and
# more for E3 and Figure 1 — which this repository does not carry and a runner cannot fetch.
# So this workflow proves the code and the configuration still hold together; it cannot prove
# that a figure still reproduces. That check is `pipelines/run.sh -- <stamp>` on a host that
# has the deposits, and README's "Open items" says which ones are published.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # The pipeline extra brings snakemake, which the DAG check below needs.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,pipeline]'

      # Lint and format are deliberately NOT gated here, and the reason is not inertia.
      # `ruff check .` reports 168 findings and `ruff format --check .` would reformat 32
      # files, but several of those files are hashed by the outputs they produce:
      # `composite_data.py` records the sha256 of itself, `draft_panel_a.py`, `fig2.py`,
      # `e3common.py` and `e3paths.py` in composite-data.json's provenance. Reformatting any
      # of them changes that cache, which breaks pins/e2_composite.outputs and makes a
      # published figure's digest unreproducible. Style here is therefore subordinate to
      # provenance, and `ruff` is run by hand when a file is touched for another reason.
      - name: Tests
        run: pytest -q

      - name: The workflow parses and every rule resolves
        # `--list` loads the Snakefile, all eight rule files and the committed config, and
        # evaluates everything that runs at parse time — the `source` and `source_ok` calls,
        # the f-string environments, every `expand`. A rule file that no longer imports, or a
        # config key nothing sets, fails here. It resolves 70 rules and builds nothing.
        #
        # `--dry-run` is NOT used, and the reason is measured rather than assumed: on a clean
        # checkout it exits 1 with MissingInputException on data/results/e1/sweep.jsonl,
        # because a dry run resolves input *files* and the deposits are not in the repository.
        # That failure says only that a runner has no deposits, which is already known.
        #
        # host.yaml is absent on a runner, which is the point: this asserts the committed
        # config is self-sufficient, with no host override needed to resolve the workflow.
        run: |
          snakemake --snakefile pipelines/Snakefile \
                    --configfile pipelines/config/config.yaml --list

      - name: Every pin is well formed and names a provenance file
        # tests/test_pins.py asserts this too; repeating it here as its own step means a
        # malformed manifest is named in the job list rather than buried in pytest output.
        run: |
          python - <<'PY'
          import pathlib, re
          bad = []
          for p in sorted(pathlib.Path("pins").glob("*.sha256")) + \
                   sorted(pathlib.Path("pins").glob("*.outputs")):
              lines = [l for l in p.read_text().splitlines()
                       if l.strip() and not l.startswith("#")]
              if not lines:
                  bad.append(f"{p}: no digest lines")
              for l in lines:
                  if not re.fullmatch(r"[0-9a-f]{64}  \S.*", l):
                      bad.append(f"{p}: malformed line: {l[:60]!r}")
          print(f"checked {len(list(pathlib.Path('pins').glob('*.sha256')))} result manifests "
                f"and {len(list(pathlib.Path('pins').glob('*.outputs')))} output pins")
          if bad:
              raise SystemExit("\n".join(bad))
          PY
