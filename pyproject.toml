[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derna2-analysis"
version = "0.1.0"
description = "Analyses and figures of the derna2 paper"
readme = "README.md"
# snakemake 9 needs 3.11+. numpy is capped below 2.3: later wheels need glibc 2.28,
# and the benchmark host has 2.17.
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.0,<2.4",
    "matplotlib>=3.8,<3.11",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
pipeline = ["snakemake>=9,<10"]

[tool.setuptools]
packages = ["derna2_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The drivers are vendored verbatim from the derna2 repository (drivers/README.md):
# keeping them byte-identical to the commit that produced the deposited results
# matters more than restyling them.
extend-exclude = ["drivers"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["derna2_analysis"]

[tool.ruff.lint.pep8-naming]
# E for energy, as in the paper.
extend-ignore-names = ["E"]
