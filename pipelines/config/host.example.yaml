# Copy to host.yaml (gitignored) and fill in. run.sh loads it after config.yaml, so any
# key here overrides that file's.

# results_root: /path/to/unpacked/deposit

# derna2's own two binaries. Leave bin_dir unset to have the pipeline clone and build them
# at `pin`; name a directory holding `derna` and `mfe_fold` to use a build you already have.
# derna2:
#   pin: main
#   bin_dir: /path/to/derna2/target/release
# e1:
#   bin_dir: /path/to/e1/bin
#   lineardesign_dir: /path/to/derna2/docs/reference/_lineardesign
#   lcds_dir: /path/to/LinearCDSfold
# fig1:
#   bin_dir: /scratch/<user>/fig1-glpe-hbb/bin

# Where ViennaRNA 2.7.2 can be imported. Used by fig1_overview, fig1_overview2_plot,
# e2_composite_example and e3_fig_story, for structure layouts rather than for folding.
# Needed only where the venv cannot install it (CentOS 7 and older glibc). See README's
# Install.
# rna_python: /path/to/venv-with-viennarna/bin/python3
